name: Publish
# A version tag (v0.2.0) publishes that version to npm once every check has passed. The checks run with read access
# only; the one job that can write runs no tests and installs nothing it did not check. It packs the package once,
# attests that tarball (GitHub artifact attestations), publishes exactly that file to npm by trusted publishing (the
# job's OIDC identity, so no token is stored, and npm signs its provenance), and attaches it with its SBOM to the tag's
# GitHub release. npm trusts this workflow for @matapao/vindu: its settings name matapao/vindu and publish.yml.
# Consumers verify with: gh attestation verify <tarball> --repo matapao/vindu
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  security:
    uses: ./.github/workflows/security.yml
    with:
      live: true # nothing is published past a known advisory

  publish:
    name: Publish @matapao/vindu
    needs: [checks, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the release and its assets
      id-token: write # the identity npm trusts to publish, and that signs the attestation and npm's provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false # nothing cached may reach what is published
      - run: corepack enable pnpm
      - name: The tag names the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Pack once, and its SBOM
        run: |
          mkdir release
          pnpm pack --pack-destination release
          pnpm sbom --sbom-format cyclonedx --prod --out release/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz
      # pnpm exchanges the job's OIDC token for a publish token for this package alone; --provenance makes a publish
      # that cannot sign its provenance fail rather than go out without it.
      - name: Publish the attested tarball to npm
        run: pnpm publish release/*.tgz --no-git-checks --registry https://registry.npmjs.org/ --access public --provenance
      - name: The release, with the tarball and its SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tgz release/sbom.cdx.json --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "@matapao/vindu $GITHUB_REF_NAME, as on npm. Verify the tarball with: gh attestation verify <tarball> --repo $GITHUB_REPOSITORY"

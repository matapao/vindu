<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>shell</title>
    <!-- the app's own page, as for app.html: the shell fills the window -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: http://*.localhost:*; media-src http://*.localhost:*; frame-src http://*.localhost:*; style-src 'self' 'unsafe-inline'"
    />
    <style>
      html, body { margin: 0; height: 100%; } #shell { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="shell"></div>
    <script type="module" src="/app.bundle.js"></script>
  </body>
</html>
